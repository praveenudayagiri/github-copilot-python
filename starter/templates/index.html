<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div class="controls">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty" name="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint">Hint</button>
    <div class="timer" aria-label="Game timer">
      <label for="timer-display">Elapsed time</label>
      <output id="timer-display" class="timer-display" role="status" aria-live="polite">00:00</output>
    </div>
    <span id="hint-count" class="hint-count">Hints used: 0</span>
    <span id="message"></span>
    <output id="conflict-status" class="sr-only" aria-live="polite" aria-atomic="true">No conflicts detected.</output>
  </div>
  <div id="sudoku-board"></div>
  <section class="leaderboard" aria-labelledby="leaderboard-title">
    <h2 id="leaderboard-title">Top 10 Leaderboard</h2>
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th scope="col">Rank</th>
          <th scope="col">Name</th>
          <th scope="col">Time</th>
          <th scope="col">Difficulty</th>
          <th scope="col">Hints</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr>
          <td colspan="5" class="leaderboard-empty">No completed games yet.</td>
        </tr>
      </tbody>
    </table>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
