<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div class="controls">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty" name="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint">Hint</button>
    <div class="timer" aria-label="Game timer">
      <label for="timer-display">Elapsed time</label>
      <output id="timer-display" class="timer-display" role="status" aria-live="polite">00:00</output>
    </div>
    <span id="hint-count" class="hint-count">Hints used: 0</span>
    <span id="message"></span>
    <output id="conflict-status" class="sr-only" aria-live="polite" aria-atomic="true">No conflicts detected.</output>
  </div>
  <div id="sudoku-board"></div>
  <script src="/static/main.js"></script>
</body>
</html>
